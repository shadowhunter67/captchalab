name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm is not installed globally: Corepack provides the exact version from "packageManager"
      # in package.json, the same way as on a developer machine.
      - name: Enable Corepack
        run: corepack enable

      - name: Install (lockfile must be up to date)
        run: corepack pnpm install --frozen-lockfile

      - name: Every workspace defines lint, typecheck and test
        run: node scripts/check-workspaces.mjs

      - name: Lint
        run: corepack pnpm -r run lint

      - name: Typecheck
        run: corepack pnpm -r run typecheck

      - name: Unit tests
        run: corepack pnpm -r run test

      - name: Build web
        run: corepack pnpm --filter web build

      # E2E runs against the production build (`next start`) with Playwright's own Chromium.
      - name: Install Playwright Chromium
        run: corepack pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E (Chromium, full suite)
        run: corepack pnpm --filter web test:e2e

      # Targeted cross-browser smoke (e2e/cross): functional paths only, no timing or pixel assertions. A functional
      # failure here blocks the job like any other test.
      - name: Install Playwright Firefox and WebKit
        run: corepack pnpm --filter web exec playwright install --with-deps firefox webkit

      - name: E2E (Firefox and WebKit smoke)
        run: corepack pnpm --filter web test:e2e:cross

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
